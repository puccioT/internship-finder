# MISE À JOUR AUTOMATIQUE — chaque nuit, sur les serveurs de GitHub (gratuit pour un repo public)
#   1. collecte  2. lecture par Gemini des nouvelles offres  3. export  4. publication -> Vercel redéploie
# La base SQLite (data/offers.db) est gardée d'une nuit à l'autre dans le cache de GitHub Actions.
# Chaque étape a un temps maximum : si la collecte ou l'IA traîne, on publie quand même ce qui est prêt.
name: Daily refresh

on:
  schedule:
    - cron: "17 4 * * *"      # 4h17 UTC (GitHub peut décaler l'heure quand il est chargé)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: "1"          # affiche les messages au fil de l'eau dans les journaux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer la base de la veille
        uses: actions/cache/restore@v4
        with:
          path: data/offers.db
          key: offers-db-${{ github.run_id }}
          restore-keys: offers-db-

      - name: Collecte
        timeout-minutes: 40
        continue-on-error: true
        env:
          WORKDAY_BUDGET_MIN: "25"
        run: python -m src.collect

      - name: Extraction IA (nouvelles offres seulement)
        timeout-minutes: 50
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXTRACT_MAX_MIN: "40"
        run: python -m src.extract

      - name: Sauvegarder la base pour la nuit suivante
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/offers.db
          key: offers-db-${{ github.run_id }}

      - name: Export
        run: python -m src.export

      - name: Publier les nouvelles données
        run: |
          NEW=$(python -c "import json;print(len(json.load(open('web/public/data/offers.json'))['offers']))")
          OLD=$(git show HEAD:web/public/data/offers.json | python -c "import json,sys;print(len(json.load(sys.stdin)['offers']))")
          echo "Offres : $OLD -> $NEW"
          if [ "$NEW" -lt $(( OLD * 7 / 10 )) ]; then
            echo "Trop d'offres perdues, publication annulée (la base continue de se remplir pour demain)."
            exit 0
          fi
          git config user.name "internship-finder-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/offers.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
            exit 0
          fi
          git commit -m "Daily refresh: $(date -u +%Y-%m-%d) ($NEW offres)"
          git pull --rebase
          git push
